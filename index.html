    <style>
        /* --- Global Reset --- */
        * {

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 3rem 2rem;
        }


        /* Hero Text Box */
        .hero-box {
            background: rgba(0, 0, 0, 0.45);
            padding: 2rem 2.5rem;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            display: inline-block;
            margin-bottom: 1rem;
        }

        .hero-box h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .hero-box .title {
            font-size: 1.25rem;
            margin-bottom: 0.3rem;
            opacity: 0.95;
        }

        .hero-box .tagline {

        }

        .links-wrapper {

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .link-group {
            background: rgba(0, 0, 0, 0.55);
            padding: 1.5rem 2rem;
            border-radius: 14px;
            backdrop-filter: blur(4px);
            width: 100%;
            max-width: 420px;
        }

        .link-group h3 {
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
            opacity: 0.85;
        }

        /* --- Buttons --- */
        .link-item {
            display: block;
            background: rgba(255,255,255,0.1);
            padding: 0.7rem 1rem;
            margin: 0.35rem 0;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-size: 1rem;
            transition: 0.2s ease;
        }

        .link-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        /* Primary emphasis button */
        .primary {
            background: #0A66C2;
        }
        .primary:hover {
            background: #0d7df2;
        }

        /* Responsive stability */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2.3rem;
            }
            .link-group {
                padding: 1.2rem 1.5rem;
            }
        }
        .hero-click {
            text-decoration: none;
            color: inherit;
            display: inline-block;
        }

        .hero-click:hover .hero-box {
            background: rgba(0, 0, 0, 0.55);  /* slightly more visible on hover */
            cursor: pointer;
        }
        html {
            scroll-behavior: smooth;
